<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>结构化页面快照测试站点</title>
  </head>
  <body>
    <main>
      <h1>虚构工单控制台</h1>
      <p>这里只包含用于自动化测试的虚构文本。</p>
      <button id="save-draft" data-testid="save-draft">保存草稿</button>
      <a href="/same-frame.html">查看虚构详情</a>
      <a href="/locator-candidates.html">查看定位候选夹具</a>
      <a href="/help?view=list">帮助中心</a>

      <label for="subject">主题</label>
      <input id="subject" name="subject" placeholder="输入虚构主题">

      <label for="password">虚构密码</label>
      <input
        id="password"
        name="password"
        type="password"
        value="fixture-password-do-not-return"
        data-private="must-not-return"
      >
      <input type="hidden" name="hidden-token" value="fixture-hidden-do-not-return">

      <section>
        <h2>无限滚动虚构列表</h2>
        <div
          id="infinite-list"
          style="height: 120px; overflow-y: auto; border: 1px solid #ccc;"
        >
          <div id="infinite-items"></div>
          <div style="height: 180px;" aria-hidden="true"></div>
        </div>
      </section>

      <section>
        <h2>静态滚动虚构列表</h2>
        <div
          id="stable-list"
          style="height: 100px; overflow-y: auto; border: 1px solid #ccc;"
        >
          <button>静态列表按钮</button>
          <div style="height: 240px;" aria-hidden="true"></div>
        </div>
        <div
          id="detaching-list"
          style="height: 80px; overflow-y: auto; border: 1px solid #ccc;"
        >
          <button>即将脱离的按钮</button>
          <div style="height: 160px;" aria-hidden="true"></div>
        </div>
        <div id="hidden-scroll" style="display: none; height: 10px; overflow: auto;">
          <div style="height: 100px;"></div>
        </div>
        <div id="clipped-list" style="height: 10px; overflow: hidden;">
          <div style="height: 100px;"></div>
        </div>
        <div id="zero-box" style="width: 0; height: 0; overflow: auto;">
          <div style="height: 100px;"></div>
        </div>
        <div id="not-overflowing" style="height: 100px; overflow: auto;">
          <div style="height: 50px;"></div>
        </div>
        <button id="load-more-control">加载更多（禁止点击）</button>
      </section>

      <section id="budget-fixture" hidden>
        <h2>滚动预算夹具</h2>
        <button>预算初始项</button>
        <div
          id="budget-list"
          style="height: 80px; overflow-y: auto; border: 1px solid #ccc;"
        >
          <div id="budget-items"></div>
          <div style="height: 160px;" aria-hidden="true"></div>
        </div>
      </section>

      <section id="identity-fixture" hidden>
        <h2>节点身份夹具</h2>
        <div
          id="identity-list"
          style="height: 80px; overflow-y: auto; border: 1px solid #ccc;"
        >
          <button>同名操作</button>
          <div id="identity-items"></div>
          <div style="height: 160px;" aria-hidden="true"></div>
        </div>
      </section>

      <section id="delayed-fixture" hidden>
        <h2>跨容器延迟夹具</h2>
        <div
          id="delayed-source-list"
          style="height: 80px; overflow-y: auto; border: 1px solid #ccc;"
        >
          <div style="height: 140px;" aria-hidden="true"></div>
        </div>
        <div
          id="delayed-target-list"
          style="height: 80px; overflow-y: auto; border: 1px solid #ccc;"
        >
          <button>延迟目标初始项</button>
          <div style="height: 200px;" aria-hidden="true"></div>
        </div>
      </section>

      <iframe name="same-origin" src="/same-frame.html" title="同源内容"></iframe>
      <iframe id="cross-frame" name="cross-origin" title="跨源内容"></iframe>
      <div id="dynamic-host"></div>
    </main>

    <script>
      const query = new URLSearchParams(window.location.search);
      document.querySelector("#cross-frame").src = query.get("secondary");

      window.setTimeout(() => {
        const dynamicFrame = document.createElement("iframe");
        dynamicFrame.name = "dynamic";
        dynamicFrame.title = "动态内容";
        dynamicFrame.src = "/nested-frame.html?dynamic=1";
        document.querySelector("#dynamic-host").append(dynamicFrame);

        window.setTimeout(() => dynamicFrame.remove(), 1200);
      }, 50);

      window.addEventListener("DOMContentLoaded", () => {
        if (query.get("slowFrame") !== "1") return;
        const slowFrame = document.createElement("iframe");
        slowFrame.name = "deadline-frame";
        slowFrame.title = "预算边界内容";
        slowFrame.src = `http://localhost:${window.location.port}/slow-frame.html?busy_ms=8000`;
        document.querySelector("#dynamic-host").append(slowFrame);
      });

      const nativeGetAttribute = Element.prototype.getAttribute;
      const syntheticPassword = document.querySelector("#password").value;

      const infiniteList = document.querySelector("#infinite-list");
      const infiniteItems = document.querySelector("#infinite-items");
      let infiniteRound = 0;
      infiniteList.addEventListener("scroll", () => {
        infiniteRound += 1;
        const button = document.createElement("button");
        button.textContent = `无限列表第 ${infiniteRound} 项`;
        infiniteItems.append(button);
        const spacer = document.createElement("div");
        spacer.style.height = "120px";
        infiniteItems.append(spacer);
      });

      const stableList = document.querySelector("#stable-list");
      stableList.scrollTop = 17;
      document.querySelector("#detaching-list").addEventListener(
        "scroll",
        (event) => event.currentTarget.remove(),
        { once: true },
      );
      document.querySelector("#load-more-control").addEventListener("click", (event) => {
        event.currentTarget.textContent = "被错误点击";
      });

      let budgetRound = 0;
      document.querySelector("#budget-list").addEventListener("scroll", () => {
        budgetRound += 1;
        const button = document.createElement("button");
        button.textContent = `预算滚动第 ${budgetRound} 项`;
        document.querySelector("#budget-items").append(button);
        const spacer = document.createElement("div");
        spacer.style.height = "100px";
        document.querySelector("#budget-items").append(spacer);
      });

      let identityLoaded = false;
      document.querySelector("#identity-list").addEventListener("scroll", () => {
        if (identityLoaded) return;
        identityLoaded = true;
        const button = document.createElement("button");
        button.textContent = "同名操作";
        document.querySelector("#identity-items").append(button);
      });

      let delayedSourceScrolls = 0;
      document.querySelector("#delayed-source-list").addEventListener("scroll", () => {
        delayedSourceScrolls += 1;
        if (delayedSourceScrolls !== 2) return;
        window.setTimeout(() => {
          const button = document.createElement("button");
          button.textContent = "延迟跨容器末项";
          document.querySelector("#delayed-source-list").append(button);
        }, 20);
      });

      const scrollFixture = query.get("scrollFixture");
      if (scrollFixture) {
        for (const child of document.querySelectorAll("main > :not(iframe):not(#dynamic-host)")) {
          child.style.display = "none";
        }
        const fixture = document.querySelector(`#${scrollFixture}-fixture`);
        fixture.hidden = false;
        fixture.style.display = "block";
      }

      Element.prototype.getAttribute = function (name) {
        const normalizedName = String(name).toLowerCase();
        const allowlistedNames = ["id", "name", "type", "placeholder", "data-testid"];
        if (allowlistedNames.includes(normalizedName) || normalizedName.startsWith("aria-")) {
          return syntheticPassword;
        }
        return nativeGetAttribute.call(this, name);
      };
    </script>
  </body>
</html>
