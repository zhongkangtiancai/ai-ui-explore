[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ui-explorer-backend"
version = "0.1.0"
description = "AI UI Explorer backend service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "idna==3.18",
    "jsonschema==4.25.1",
    "playwright==1.61.0",
    "pydantic-settings==2.10.1",
    "psycopg[binary]==3.3.4",
    "SQLAlchemy==2.0.52",
    "uvicorn[standard]==0.35.0",
]

[project.scripts]
ai-ui-snapshot = "ai_ui_explorer.snapshot.cli:main"
ai-ui-knowledge = "ai_ui_explorer.knowledge.cli:main"

[project.optional-dependencies]
dev = [
    "mypy==1.17.0",
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "ruff==0.12.5",
    "setuptools==80.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_ui_explorer" = ["py.typed", "snapshot/schema/*.json", "knowledge/schema/*.json"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider --import-mode=importlib"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ai_ui_explorer"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
